<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Home</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .slideshow {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .slideshow img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        animation: slideShow 25s infinite;
      }

      .slideshow img:nth-child(1) {
        animation-delay: 0s;
      }
      .slideshow img:nth-child(2) {
        animation-delay: 5s;
      }
      .slideshow img:nth-child(3) {
        animation-delay: 10s;
      }
      .slideshow img:nth-child(4) {
        animation-delay: 15s;
      }
      .slideshow img:nth-child(5) {
        animation-delay: 20s;
      }

      @keyframes slideShow {
        0% {
          opacity: 0;
        }
        4% {
          opacity: 1;
        }
        20% {
          opacity: 1;
        }
        24% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="text-white relative">
    <div class="slideshow">
      <img src="images/one.jpg" alt="Slide 1" />
      <img src="images/two.jpg" alt="Slide 2" />
      <img src="images/three.jpg" alt="Slide 3" />
      <img src="images/four.jpg" alt="Slide 4" />
      <img src="images/five.jpg" alt="Slide 5" />
    </div>
    <div class="absolute top-0 left-0 w-full h-full bg-black bg-opacity-40 z-10"></div>

    <header class="absolute top-0 left-0 w-full z-20">
      <div class="flex items-center justify-between px-8 py-4 text-white">
        <div class="text-xl font-bold">
          Logo
          <span class="block text-sm">Connector<br />digital simplifying services</span>
        </div>

        <nav>
          <ul class="flex gap-8 font-medium">
            <li class="hover:text-blue-300 cursor-pointer">Home</li>
            <li class="hover:text-blue-300 cursor-pointer">Categories</li>
            <li class="hover:text-blue-300 cursor-pointer">Services</li>
            <li class="hover:text-blue-300 cursor-pointer">Providers</li>
            <li class="hover:text-blue-300 cursor-pointer">Blog</li>
            <li class="hover:text-blue-300 cursor-pointer">Contact</li>
          </ul>
        </nav>

        <div class="flex items-center gap-4">
          <input
            type="search"
            placeholder="Search here..."
            class="px-3 py-1 rounded-md bg-white text-black placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400"
          />
          <button class="bg-blue-600 text-white px-4 py-1 rounded-md hover:bg-blue-700">
            Login
          </button>
        </div>
      </div>
    </header>

    <section class="absolute bottom-20 left-1/2 transform -translate-x-1/2 text-center z-20">
      <div class="flex gap-20 text-white font-semibold text-lg">
        <div>
          <p class="text-4xl text-blue-300">0+</p>
          <p>Total Sales</p>
        </div>
        <div>
          <p class="text-4xl text-blue-300">58+</p>
          <p>Total Service Providers</p>
        </div>
        <div>
          <p class="text-4xl text-blue-300">3+</p>
          <p>Total Services Done</p>
        </div>
      </div>
    </section>
  </body>
</html>
